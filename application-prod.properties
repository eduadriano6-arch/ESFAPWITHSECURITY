# Perfil de PRODUCCIÓN: -Dspring.profiles.active=prod
# Variables de entorno obligatorias: PORTAL_DATA_KEY, DB_FILE_PASSWORD, DB_USER_PASSWORD
portal.require-https=true
portal.require-key=true
portal.seed.demo-passwords=false
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true

# Base de datos cifrada en disco (H2 CIPHER=AES). Contraseña = "<clave-de-archivo> <contraseña-de-usuario>"
spring.datasource.url=jdbc:h2:file:./data/esfap-enc;CIPHER=AES
spring.datasource.username=sa
spring.datasource.password=${DB_FILE_PASSWORD} ${DB_USER_PASSWORD}

# TLS directo (si no hay proxy inverso con TLS 1.2+): configure server.ssl.* con su keystore y
#   server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
