# ===== Portal ESFAP: configuración segura por defecto =====
server.port=8080
# Escucha solo en el equipo local; detrás de un proxy/contenedor use PORTAL_BIND=0.0.0.0
server.address=${PORTAL_BIND:127.0.0.1}

# Base de datos local (H2 en archivo ./data). Sin AUTO_SERVER: no abre ningún puerto TCP.
spring.datasource.url=jdbc:h2:file:./data/esfap
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Sesión: cookie opaca, HttpOnly (JavaScript no puede leerla), Secure, SameSite=Strict y prefijo __Host-
server.servlet.session.timeout=5m
server.servlet.session.cookie.name=__Host-ESFAPSESSION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie

# Sin filtrar información interna en errores
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
server.server-header=
server.max-http-request-header-size=16KB
server.tomcat.connection-timeout=10s
server.tomcat.max-swallow-size=2MB
server.shutdown=graceful

# Opciones del portal (ver docs/SEGURIDAD.md)
portal.require-https=false
portal.require-key=false
portal.seed.demo-passwords=false
